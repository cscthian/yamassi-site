services:
  yamassi-site:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: yamassi-site
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "4321:4321"
    environment:
      - HOST=0.0.0.0
      - PORT=4321
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.astro
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        - action: rebuild
          path: ./package.json
    restart: unless-stopped
